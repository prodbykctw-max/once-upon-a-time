<!doctype html>
<meta charset="utf-8">
<title>Atlanta world preview</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#dfe3ea}
  /* touch-action:none, or dragging to orbit scrolls/zooms the PAGE on a phone
     and the camera never moves. The preview link is opened on a phone more
     often than on a desktop. */
  canvas{display:block;touch-action:none}
  #hud{position:fixed;left:12px;top:12px;padding:10px 13px;border-radius:9px;
    background:rgba(10,12,16,.78);backdrop-filter:blur(6px);pointer-events:none;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
  #hud b{font-size:14px;letter-spacing:.01em}
  #hud .m{color:#8e96a6;font-size:11.5px;margin-top:3px}
  #hud .warn{color:#e5a05a}
  /* On-screen equivalents of R / O / , / . — a phone has no keyboard, and
     without these the whole runner-eye view is unreachable on the device the
     client actually opens the link on. */
  #bar{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;
    max-width:calc(100vw - 24px)}
  #bar button{appearance:none;border:1px solid rgba(255,255,255,.09);
    background:rgba(22,26,33,.88);color:#c6ccd8;font:inherit;font-size:12px;
    padding:9px 13px;border-radius:9px;cursor:pointer;touch-action:manipulation}
  #bar button.on{background:#2f6ae0;color:#fff;border-color:transparent}
  #bar button:active{transform:translateY(1px)}
  /* a chip, not bare text — over the dark asphalt it was invisible */
  #keys{position:fixed;left:12px;bottom:58px;color:#8e96a6;font-size:11.5px;
    background:rgba(10,12,16,.72);padding:5px 9px;border-radius:7px}
  #keys b{color:#c6ccd8}
  #pick{position:fixed;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;
    max-width:46vw;justify-content:flex-end;align-items:center}
  #pick a{padding:5px 10px;border-radius:999px;background:rgba(22,26,33,.85);color:#c6ccd8;
    text-decoration:none;font-size:11.5px;border:1px solid rgba(255,255,255,.07)}
  #pick a.on{background:#2f6ae0;color:#fff;border-color:transparent}
  #att{position:fixed;right:12px;bottom:12px;color:#5b6271;font-size:10.5px}

  /* At phone width the four corners collide: the location chips land ON the
     HUD and the OSM attribution runs under the buttons. Stack instead.
     THIS BLOCK MUST STAY LAST. Written above the base rules it lost every
     shared property to the cascade — equal specificity, later wins — and the
     chips inherited `top:12px` AND `bottom:66px`, stretching into 350px pills.
     A media query is not more specific than the rule it is overriding. */
  #dock{display:contents}
  @media (max-width:640px){
    #keys{display:none}
    #hud{right:12px}
    /* ONE flex column owns the bottom, so nothing is positioned against a
       guessed offset. Stacking three fixed elements with hand-picked `bottom`
       values collided at 390px AND again at 360px once the buttons wrapped to
       two rows — a stack whose height depends on wrapping cannot be laid out
       with constants. */
    #dock{display:flex;flex-direction:column;align-items:stretch;gap:8px;
      position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom))}
    #pick,#bar,#att{position:static;max-width:none}
    #att{text-align:right}
  }
</style>
<div id="hud"><b id="t">loading…</b><div class="m" id="m"></div></div>
<!-- #dock is `display:contents` on a wide screen, so each child keeps its own
     corner; on a phone it becomes the one bottom column that owns them all. -->
<div id="dock">
  <div id="pick"></div>
  <div id="keys">drag orbit · scroll zoom · <b>R</b> runner eye · <b>O</b> overview · <b>,</b>/<b>.</b> move along route</div>
  <div id="bar">
    <button id="bOver" class="on">overview</button>
    <button id="bRun">runner eye</button>
    <button id="bBack">&minus; back</button>
    <button id="bFwd">forward &plus;</button>
  </div>
  <div id="att"></div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { buildCity, lightRig, heightAt } from './city.js';
import { asset } from './base.js';

const KEYS = ['mbs', 'dsa', 'wade', 'stonemtn'];
const key = new URLSearchParams(location.search).get('loc') || 'mbs';

const pick = document.getElementById('pick');
for (const k of KEYS) {
  const a = document.createElement('a');
  a.href = '?loc=' + k; a.textContent = k; if (k === key) a.className = 'on';
  pick.appendChild(a);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb4d8);

// ── AN ENVIRONMENT, OR METAL AND GLASS RENDER BLACK ─────────────────────────
// The stadium's curtain wall came out pure black on the first pass. Nothing was
// wrong with the geometry or the material: a MeshStandardMaterial at metalness
// 0.78 reflects its environment almost entirely, and with no environment set
// there is nothing to reflect. Reflective surfaces need something to reflect —
// an easy half-hour to lose to "the shader is broken".
// A painted sky/ground gradient through PMREM is enough, and it lifts every
// other material in the scene at the same time.
function skyEnvironment(renderer) {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 256;
  const g = c.getContext('2d').createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#5b8fd0');   // zenith
  g.addColorStop(0.45, '#aecbe8');
  g.addColorStop(0.52, '#dfe7ef');   // horizon haze
  g.addColorStop(0.58, '#8c8578');   // ground bounce
  g.addColorStop(1.00, '#4a443a');
  const ctx = c.getContext('2d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 32, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
  return env;
}
scene.environment = skyEnvironment(renderer);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.5, 6000);

// ── FOV IS VERTICAL, SO A PHONE HELD UPRIGHT IS A TELEPHOTO LENS ───────────
// three.js `fov` is the VERTICAL angle, and horizontal follows the aspect. At
// 390x844 that is aspect 0.46, so a 58 deg vertical is **29 deg horizontal** —
// a zoom lens. Measured on the phone viewport: the runner view was a corridor
// of tarmac with the stadium cropped clean out of frame, which reads as "the
// city is missing" and is a lens choice.
// Widen the vertical until the HORIZONTAL stays usable, capped at 82 so the
// near ground does not fisheye. Landscape keeps the 58 it was framed for.
function fitFov() {
  const a = innerWidth / innerHeight;
  const want = 2 * Math.atan(Math.tan((27.5 * Math.PI) / 180) / a) * (180 / Math.PI);
  camera.fov = Math.max(58, Math.min(82, want));
  camera.aspect = a;
  camera.updateProjectionMatrix();
}
fitFov();

const world = await (await fetch(asset(`world/${key}.json`))).json();
const R = world.location.radius_m;
scene.fog = new THREE.Fog(0x8fb4d8, R * 0.9, R * 3.4);
// ?life=1 populates the streets; ?peds=N&cars=N tune it.
const qsp = new URLSearchParams(location.search);
const lifeOpt = qsp.get('life') === '0' ? null
  : { peds: +(qsp.get('peds') ?? 260), cars: +(qsp.get('cars') ?? 90) };
const { group, stats, route, routeLength, life } = buildCity(world, { life: lifeOpt });
scene.add(group);
lightRig(scene, R);

document.getElementById('t').textContent = world.location.label;
document.getElementById('m').innerHTML =
  `${world.location.osm} · ${R} m radius<br>` +
  `${stats.draws} draw calls · ${Math.round(stats.tris).toLocaleString()} triangles` +
  (stats.relief ? ` · ${stats.relief} m relief` : ' · flat') +
  (stats.props ? ` · ${stats.props} props (${stats.propKinds} kinds)` : '') +
  (stats.life ? `<br>${stats.life.peds} people walking · ${stats.life.cars} vehicles driving ` +
                `(${stats.life.footKm} km footway, ${stats.life.driveKm} km road)` : '') +
  (stats.draws <= 150 ? '' : ' <span class="warn">(over 150)</span>') + '<br>' +
  `${stats.surveyed} surveyed height · <span class="warn">${stats.estimated} estimated</span>`;
document.getElementById('att').textContent = world.attribution;

// ── cameras ─────────────────────────────────────────────────────────────────
// WHERE THE RUNNER VIEW STARTS IS MEASURED, NOT 0.12 FOR EVERYTHING.
// A shared default put the stadium run on a stretch of tarmac with the landmark
// cropped out of frame, which reads as "there is nothing here". Sampled a 7x9
// ray grid along each route at 0.1 steps and took the point where the location's
// own geometry actually fills the frame:
//   mbs 0.55  (hero 21% of the frame; 0.12 was 0%)
//   dsa 0.30  ·  wade 0.30  ·  stonemtn 0.20 (the dome is 62% terrain there)
// Past ~0.4 the DSA and Stone Mountain routes leave the extract and the frame
// goes 78-94% sky — so these are also the last point that still has a world in it.
const START_T = { mbs: 0.55, dsa: 0.30, wade: 0.30, stonemtn: 0.20 };
const qf = (k, d) => { const v = parseFloat(new URLSearchParams(location.search).get(k)); return Number.isFinite(v) ? v : d; };
let mode = 'overview', t = qf('t', START_T[key] ?? 0.12), yaw = 0.6, pitch = 0.62, dist = R * 1.5;

// THE GROUND MOVED AND THE CAMERA DID NOT. Once the terrain carried real
// elevation, a runner camera pinned to y=1.75 absolute ended up UNDERGROUND
// wherever the ground rose — which renders as a black lower half and looks like
// a shader fault. Eye height is relative to the ground beneath her, always.
const groundAt = (x, z) => heightAt(world.elevation, x, -z);

function routePoint(u) {
  const p = route.pts;
  const segs = [];
  let total = 0;
  for (let i = 1; i < p.length; i++) {
    const d = Math.hypot(p[i][0] - p[i-1][0], p[i][1] - p[i-1][1]);
    segs.push(d); total += d;
  }
  let want = u * total, i = 0;
  while (i < segs.length && want > segs[i]) { want -= segs[i]; i++; }
  i = Math.min(i, segs.length - 1);
  const f = segs[i] ? want / segs[i] : 0;
  const a = p[i], b = p[i + 1] || p[i];
  return {
    x: a[0] + (b[0] - a[0]) * f, z: -(a[1] + (b[1] - a[1]) * f),
    hx: b[0] - a[0], hz: -(b[1] - a[1]),
  };
}

function place() {
  if (mode === 'runner' && route) {
    // Behind-the-back, at a runner's eye height — the framing the game will
    // actually use, which is the only view that says whether the scale is right.
    // Eye height, not drone height. 3.1 m looking at 1.6 m pitched the camera
    // DOWN and filled the frame with tarmac; a runner's eye is ~1.7 m and looks
    // level or slightly up, which is what puts the city in frame.
    const p = routePoint(t), look = routePoint(Math.min(t + 0.06, 1));
    const L = Math.hypot(p.hx, p.hz) || 1;
    const cxp = p.x - (p.hx / L) * 6, czp = p.z - (p.hz / L) * 6;
    camera.position.set(cxp, groundAt(cxp, czp) + 1.75, czp);
    camera.lookAt(look.x, groundAt(look.x, look.z) + 2.6, look.z);
  } else {
    const ox = Math.cos(yaw) * Math.cos(pitch) * dist;
    const oz = Math.sin(yaw) * Math.cos(pitch) * dist;
    // never below the ground it is orbiting over
    const oy = Math.max(Math.sin(pitch) * dist, groundAt(ox, oz) + 6);
    camera.position.set(ox, oy, oz);
    camera.lookAt(0, groundAt(0, 0) + 20, 0);
  }
}
place();

addEventListener('resize', () => {
  fitFov();
  renderer.setSize(innerWidth, innerHeight);
});
// ── input. Pointer events cover mouse and touch in one path; the only thing
//    they do NOT give for free is the two-finger pinch, which is the ONLY way
//    to zoom on a phone (there is no wheel). Track every live pointer so the
//    second finger is available rather than discarded.
const live = new Map();
let drag = null, pinch = 0;
const zoomTo = (d) => { dist = Math.max(R * 0.15, Math.min(R * 4, d)); place(); };
const spread = () => {
  const [a, b] = [...live.values()];
  return Math.hypot(a[0] - b[0], a[1] - b[1]);
};
renderer.domElement.addEventListener('pointerdown', (e) => {
  live.set(e.pointerId, [e.clientX, e.clientY]);
  if (live.size === 2) { pinch = spread(); drag = null; }
  else drag = [e.clientX, e.clientY];
});
const lift = (e) => {
  live.delete(e.pointerId);
  if (live.size < 2) pinch = 0;
  if (!live.size) drag = null;
};
addEventListener('pointerup', lift);
addEventListener('pointercancel', lift);
addEventListener('pointermove', (e) => {
  if (!live.has(e.pointerId)) return;
  live.set(e.pointerId, [e.clientX, e.clientY]);
  if (live.size >= 2) {
    const s = spread();
    if (pinch && s) zoomTo(dist * (pinch / s));
    pinch = s;
    return;
  }
  if (!drag || mode === 'runner') return;
  yaw -= (e.clientX - drag[0]) * 0.006;
  pitch = Math.max(0.08, Math.min(1.5, pitch + (e.clientY - drag[1]) * 0.005));
  drag = [e.clientX, e.clientY]; place();
});
addEventListener('wheel', (e) => {
  zoomTo(dist * (1 + Math.sign(e.deltaY) * 0.1));
}, { passive: true });

const bOver = document.getElementById('bOver'), bRun = document.getElementById('bRun');
function setMode(m) {
  mode = m;
  bOver.classList.toggle('on', m === 'overview');
  bRun.classList.toggle('on', m === 'runner');
  place();
}
const step = (d) => { t = Math.max(0, Math.min(1, t + d)); if (mode !== 'runner') setMode('runner'); else place(); };
bOver.onclick = () => setMode('overview');
bRun.onclick = () => setMode('runner');
document.getElementById('bBack').onclick = () => step(-0.02);
document.getElementById('bFwd').onclick = () => step(0.02);
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'r') setMode('runner');
  else if (k === 'o') setMode('overview');
  else if (k === ',') step(-0.02);
  else if (k === '.') step(0.02);
});

// expose for headless capture
// what is actually under a screen point — for diagnosing "what IS that?"
window.__pick = (nx, ny) => {
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(nx, ny), camera);
  const hits = rc.intersectObjects(scene.children, true);
  return hits.slice(0, 4).map((h) => ({
    name: h.object.name || h.object.type,
    dist: +h.distance.toFixed(1),
    y: +h.point.y.toFixed(1),
  }));
};
window.__preview = {
  setMode: (m, u) => { mode = m; if (u != null) t = u; place(); },
  setOrbit: (y, p, d) => { yaw = y; pitch = p; dist = d * R; place(); },
  stats, routeLength, ready: true, life, scene, camera,
};

// diagnostics for headless checks
{
  const glass = [];
  group.traverse((o) => { if (o.isMesh && o.material && o.material.metalness > 0.5) glass.push(o); });
  const g0 = glass[0];
  let outward = null;
  if (g0) {
    const n = g0.geometry.attributes.normal, p = g0.geometry.attributes.position;
    // does the first face normal point AWAY from the building centre?
    g0.geometry.computeBoundingSphere();
    const c = g0.geometry.boundingSphere.center;
    const dx = p.getX(0) - c.x, dz = p.getZ(0) - c.z;
    outward = (dx * n.getX(0) + dz * n.getZ(0)) > 0;
  }
  window.__diag = {
    sceneEnvironment: !!scene.environment,
    envType: scene.environment ? scene.environment.constructor.name : null,
    glassMeshes: glass.length,
    glassNormalPointsOutward: outward,
    toneMapping: renderer.toneMapping,
  };
}
// A real clock, not a fixed 1/60 — the agents must not slow down on a slow
// frame, and must not sprint on a fast one. Clamped so a backgrounded tab does
// not teleport the whole city on return.
let _prev = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.05, (now - _prev) / 1000);
  _prev = now;
  if (life) life.update(dt);
  renderer.render(scene, camera);
});
</script>
